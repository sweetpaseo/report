<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACS Social Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">AcS</div>
        <div>
          <h1>ACS Assistant</h1>
          <p class="subtitle">Social Media Optimization</p>
        </div>
      </div>
      <div id="statusIndicator" class="indicator offline"></div>
    </header>

    <!-- State 1: Login Form -->
    <section id="loginSection" class="section">
      <p class="desc">Masuk dengan akun staff ACS Anda untuk menghubungkan browser ke dashboard.</p>
      
      <div class="field">
        <label>Server ACS URL</label>
        <input type="text" id="inputServerUrl" value="https://report.erihome.id" placeholder="https://report.erihome.id">
      </div>

      <div class="field">
        <label>Email Staff</label>
        <input type="email" id="inputEmail" placeholder="staff.social@erihome.id">
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="inputPassword" placeholder="••••••••">
      </div>

      <button id="btnLogin" class="btn primary">Hubungkan ke ACS</button>
      <p id="loginError" class="error-msg"></p>
    </section>

    <!-- State 2: Active Dashboard -->
    <section id="activeSection" class="section hidden">
      <!-- Staff Card -->
      <div class="user-card">
        <div>
          <strong id="labelStaffName">Staff Name</strong>
          <span id="labelStaffEmail">email@domain.com</span>
        </div>
        <button id="btnLogout" class="btn-text">Keluar</button>
      </div>

      <!-- Client Selector -->
      <div class="field">
        <label>Pilih Klien Aktif</label>
        <select id="selectClient">
          <option value="">Memuat daftar klien...</option>
        </select>
      </div>

      <!-- Detected Profile State -->
      <div class="detect-box">
        <div class="detect-header">
          <span class="label-title">Halaman Terdeteksi</span>
          <span id="badgePlatform" class="badge">Mendeteksi...</span>
        </div>
        <div class="detect-content">
          <strong id="labelDetectedUsername">Buka profil Instagram/TikTok</strong>
          <p id="labelDetectHint" class="detect-hint">Buka tab profil medsos klien di browser ini.</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="btnSyncNow" class="btn primary">
          <span>⚡ Sinkronkan ke ACS Sekarang</span>
        </button>
        <button id="btnOpenDashboard" class="btn secondary">
          <span>Buka ACS Dashboard</span>
        </button>
      </div>

      <div id="syncFeedback" class="feedback hidden"></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
